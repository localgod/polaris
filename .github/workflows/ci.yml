name: CI

# Branch work is covered by pull_request alone — also triggering on push to
# feature branches ran the whole matrix twice per commit (the two events use
# different refs, so the concurrency group never deduplicated them).
# push to main checks the merged result, which no PR run ever sees.
# workflow_dispatch runs CI on a branch that has no PR yet.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale runs on a PR branch, but let every main run finish so each
  # merge gets a complete result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run mdlint

      - name: eslint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    # Non-blocking until the existing type errors are paid down — flip this to
    # false (or delete it) once `npm run typecheck` passes on main.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      test-layers: ${{ steps.build-matrix.outputs.test-layers }}
      run-tests: ${{ steps.build-matrix.outputs.run-tests }}
      build-required: ${{ steps.build-matrix.outputs.build-required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            config:
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'nuxt.config.ts'
            build:
              - 'app/**'
              - 'server/**'
              - 'public/**'
              - 'types/**'
              - 'nuxt.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.nuxtrc'
            integration:
              - 'server/**'
              - 'types/**'
              - 'test/integration/**'
            server-api:
              - 'server/api/**'
              - 'server/plugins/**'
              - 'server/middleware/**'
              - 'types/**'
            server-services:
              - 'server/services/**'
              - 'server/utils/**'
              - 'types/**'
            server-repositories:
              - 'server/database/**'
              - 'server/repositories/**'
              - 'server/schemas/**'
              - 'types/**'
            server-utils:
              - 'server/utils/**'
              - 'server/middleware/**'
              - 'types/**'
            schema:
              - 'schema/**'
            app-e2e:
              - 'app/**'
              - 'types/**'

      - name: Build test matrix
        id: build-matrix
        run: |
          # Config changes (package.json, vitest.config.ts, etc.) could break anything — run all layers
          if [[ '${{ steps.filter.outputs.config }}' == 'true' ]]; then
            echo "Config files changed — running all test layers"
            LAYERS='["integration","server-api","server-services","server-repositories","server-utils","schema","app-e2e","smoke"]'
          else
            # Take matched layers, drop 'config' (not a test layer), append 'smoke' if any code changed
            LAYERS=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(. != "config" and . != "build")]')
            if [ "$LAYERS" != "[]" ]; then
              LAYERS=$(echo "$LAYERS" | jq -c '. + ["smoke"]')
            fi
          fi

          if [ "$LAYERS" == "[]" ]; then
            echo "No relevant code changes — skipping tests"
            echo "run-tests=false" >> $GITHUB_OUTPUT
          else
            echo "Running test layers: $LAYERS"
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi
          echo "test-layers=$LAYERS" >> $GITHUB_OUTPUT

          # Build is required when app, server, or config files changed
          if [[ '${{ steps.filter.outputs.build }}' == 'true' ]]; then
            echo "build-required=true" >> $GITHUB_OUTPUT
          else
            echo "build-required=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run-tests == 'true'

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        test-layer: ${{ fromJson(needs.detect-changes.outputs.test-layers) }}

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (E2E tests only)
        if: matrix.test-layer == 'app-e2e'
        run: npx playwright install chromium --with-deps

      - name: Neo4j setup
        uses: ./.github/actions/neo4j-setup

      - name: Start dev server (E2E and HTTP integration tests)
        if: matrix.test-layer == 'app-e2e' || matrix.test-layer == 'integration'
        run: |
          npm run dev &
          ready=0
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/version > /dev/null; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then
                exit 0
              fi
            else
              ready=0
              echo "Attempt $i/30: Dev server not ready yet, waiting..."
            fi
            sleep 2
          done
          echo "Dev server failed to start"
          exit 1
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          AUTH_SECRET: test-secret-for-vitest

      - name: Run ${{ matrix.test-layer }} tests with coverage
        run: npm run test:$(echo '${{ matrix.test-layer }}' | tr '-' ':') -- --coverage
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          NUXT_TEST_BASE_URL: http://localhost:3000

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.test-layer }}
          path: coverage/
          retention-days: 7

  coverage-report:
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: always() && needs.detect-changes.outputs.run-tests == 'true'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-artifacts/

      - name: Merge coverage reports
        run: |
          mkdir -p .nyc_output coverage

          find coverage-artifacts -name 'coverage-final.json' -type f | while read file; do
            layer=$(basename $(dirname "$file"))
            cp "$file" ".nyc_output/${layer}.json"
          done

          npx nyc merge .nyc_output coverage/coverage-final.json
          npx nyc report \
            --temp-dir .nyc_output \
            --report-dir coverage \
            --reporter=json-summary \
            --reporter=json \
            --reporter=lcov \
            --reporter=html \
            --reporter=text

      - name: Check coverage thresholds
        run: node scripts/check-coverage-thresholds.mjs

      - name: Report coverage to PR
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build-required == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d ".output" ]; then
            echo "Build failed: .output directory not found"
            exit 1
          fi
          echo "Build successful: .output directory created"

  lighthouse:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build-required == 'true'

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Neo4j setup
        uses: ./.github/actions/neo4j-setup

      - name: Build
        run: npm run build
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          AUTH_ORIGIN: http://localhost:3000/api/auth
          AUTH_TRUST_HOST: 'true'

      - name: Start preview server
        run: |
          npm run preview -- -p 3000 &
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              exit 0
            fi
            echo "Attempt $i/30: Preview server not ready yet, waiting..."
            sleep 2
          done
          echo "Preview server failed to start"
          exit 1
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          AUTH_ORIGIN: http://localhost:3000/api/auth
          AUTH_TRUST_HOST: 'true'
          HOST: 0.0.0.0

      - name: Run Lighthouse audits
        run: npm run lighthouse
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          LIGHTHOUSE_BASE_URL: http://localhost:3000

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7
