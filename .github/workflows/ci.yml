name: CI

# Branch work is covered by pull_request alone — also triggering on push to
# feature branches ran the whole matrix twice per commit (the two events use
# different refs, so the concurrency group never deduplicated them).
# push to main checks the merged result, which no PR run ever sees.
# workflow_dispatch runs CI on a branch that has no PR yet.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale runs on a PR branch, but let every main run finish so each
  # merge gets a complete result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run mdlint

      - name: eslint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    # Non-blocking until the existing type errors are paid down — flip this to
    # false (or delete it) once `npm run typecheck` passes on main.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      test-layers: ${{ steps.build-matrix.outputs.test-layers }}
      db-layers: ${{ steps.build-matrix.outputs.db-layers }}
      run-tests: ${{ steps.build-matrix.outputs.run-tests }}
      build-required: ${{ steps.build-matrix.outputs.build-required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Every test layer lists its own test directory, so a test-only change
          # still runs that layer. Shared test infrastructure and the CI
          # definition itself go under config, which runs everything.
          filters: |
            config:
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'vitest.config.ts'
              - 'vitest.*.config.ts'
              - 'tsconfig.json'
              - 'nuxt.config.ts'
              - 'test/setup/**'
              - 'test/fixtures/**'
              - 'scripts/check-coverage-thresholds.mjs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            build:
              - 'app/**'
              - 'server/**'
              - 'public/**'
              - 'types/**'
              - 'nuxt.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.nuxtrc'
              - 'scripts/copy-runtime-assets.mjs'
              - '.github/workflows/ci.yml'
            integration:
              - 'server/**'
              - 'types/**'
              - 'test/integration/**'
            server-api:
              - 'server/api/**'
              - 'server/plugins/**'
              - 'server/middleware/**'
              - 'types/**'
              - 'test/server/api/**'
            server-services:
              - 'server/services/**'
              - 'server/utils/**'
              - 'types/**'
              - 'test/server/services/**'
            server-repositories:
              - 'server/database/**'
              - 'server/repositories/**'
              - 'server/schemas/**'
              - 'types/**'
              - 'test/server/repositories/**'
            server-utils:
              - 'server/utils/**'
              - 'server/middleware/**'
              - 'types/**'
              - 'test/server/utils/**'
            server-middleware:
              - 'server/middleware/**'
              - 'server/utils/**'
              - 'types/**'
              - 'test/server/middleware/**'
            schema:
              - 'schema/**'
              - 'test/schema/**'
            app-unit:
              - 'app/**'
              - 'types/**'
              - 'test/app/**'
            app-e2e:
              - 'app/**'
              - 'types/**'
              - 'test/app/e2e/**'

      - name: Build test matrix
        id: build-matrix
        run: |
          # Layer names map to npm scripts: server-api → test:server:api.
          # Together they cover every spec under test/ except test/integration
          # (its own layer) — keep this list in sync when adding a test directory.
          ALL_LAYERS='["integration","server-api","server-services","server-repositories","server-utils","server-middleware","schema","app-unit","app-e2e"]'

          # Only these layers talk to Neo4j; the rest skip the service container
          # and the migrate/seed step.
          echo 'db-layers=["integration","server-repositories","schema","app-e2e"]' >> $GITHUB_OUTPUT

          # Config changes (package.json, vitest.config.ts, etc.) could break anything — run all layers
          if [[ '${{ steps.filter.outputs.config }}' == 'true' ]]; then
            echo "Config files changed — running all test layers"
            LAYERS="$ALL_LAYERS"
          else
            # Take matched layers, dropping the filters that aren't test layers
            LAYERS=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(. != "config" and . != "build")]')
          fi

          if [ "$LAYERS" == "[]" ]; then
            echo "No relevant code changes — skipping tests"
            echo "run-tests=false" >> $GITHUB_OUTPUT
          else
            echo "Running test layers: $LAYERS"
            echo "run-tests=true" >> $GITHUB_OUTPUT
          fi
          echo "test-layers=$LAYERS" >> $GITHUB_OUTPUT

          # Build is required when app, server, or config files changed
          if [[ '${{ steps.filter.outputs.build }}' == 'true' ]]; then
            echo "build-required=true" >> $GITHUB_OUTPUT
          else
            echo "build-required=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run-tests == 'true'

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        test-layer: ${{ fromJson(needs.detect-changes.outputs.test-layers) }}

    services:
      neo4j:
        # An empty image skips the container, so layers that never touch the
        # database don't wait for Neo4j to start.
        image: ${{ contains(fromJson(needs.detect-changes.outputs.db-layers), matrix.test-layer) && 'neo4j:5.26-community' || '' }}
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (E2E tests only)
        if: matrix.test-layer == 'app-e2e'
        run: npx playwright install chromium --with-deps

      - name: Neo4j setup
        if: contains(fromJson(needs.detect-changes.outputs.db-layers), matrix.test-layer)
        uses: ./.github/actions/neo4j-setup

      - name: Start dev server (E2E and HTTP integration tests)
        if: matrix.test-layer == 'app-e2e' || matrix.test-layer == 'integration'
        run: |
          npm run dev &
          ready=0
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/version > /dev/null; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then
                exit 0
              fi
            else
              ready=0
              echo "Attempt $i/30: Dev server not ready yet, waiting..."
            fi
            sleep 2
          done
          echo "Dev server failed to start"
          exit 1
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          AUTH_SECRET: test-secret-for-vitest

      - name: Run ${{ matrix.test-layer }} tests with coverage
        run: npm run test:$(echo '${{ matrix.test-layer }}' | tr '-' ':') -- --coverage
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          NUXT_TEST_BASE_URL: http://localhost:3000

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.test-layer }}
          path: coverage/
          retention-days: 7

  coverage-report:
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: always() && needs.detect-changes.outputs.run-tests == 'true'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-artifacts/

      - name: Merge coverage reports
        run: |
          mkdir -p .nyc_output coverage

          layers=()
          while read -r file; do
            layer=$(basename "$(dirname "$file")")
            cp "$file" ".nyc_output/${layer}.json"
            layers+=("${layer#coverage-}")
          done < <(find coverage-artifacts -name 'coverage-final.json' -type f)

          # Tell the threshold check which layers contributed, so it only judges
          # folders whose own tests ran in this workflow.
          echo "COVERAGE_LAYERS=$(IFS=,; echo "${layers[*]}")" >> "$GITHUB_ENV"

          npx nyc merge .nyc_output coverage/coverage-final.json
          npx nyc report \
            --temp-dir .nyc_output \
            --report-dir coverage \
            --reporter=json-summary \
            --reporter=json \
            --reporter=lcov \
            --reporter=html \
            --reporter=text

      - name: Check coverage thresholds
        run: node scripts/check-coverage-thresholds.mjs

      - name: Report coverage to PR
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.build-required == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Baked in at build time; matches the preview server the lighthouse
          # job runs from this build's output.
          AUTH_ORIGIN: http://localhost:3000/api/auth
          AUTH_TRUST_HOST: 'true'

      - name: Check build output
        run: |
          if [ ! -d ".output" ]; then
            echo "Build failed: .output directory not found"
            exit 1
          fi
          echo "Build successful: .output directory created"

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuxt-output
          path: .output/
          include-hidden-files: true
          retention-days: 1

  lighthouse:
    runs-on: ubuntu-latest
    # Audits the build job's output rather than building a second time.
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.build-required == 'true'

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Neo4j setup
        uses: ./.github/actions/neo4j-setup

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuxt-output
          path: .output/

      - name: Start preview server
        run: |
          npm run preview -- -p 3000 &
          # -f so an error page doesn't count as ready; two successes in a row
          # so a server that is still warming up isn't audited.
          ready=0
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/version > /dev/null && curl -sf http://localhost:3000/ > /dev/null; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then
                exit 0
              fi
            else
              ready=0
              echo "Attempt $i/30: Preview server not ready yet, waiting..."
            fi
            sleep 2
          done
          echo "Preview server failed to start"
          exit 1
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          AUTH_ORIGIN: http://localhost:3000/api/auth
          AUTH_TRUST_HOST: 'true'
          # Read at runtime; without it every SSR page answers 500
          AUTH_SECRET: test-secret-for-lighthouse
          HOST: 0.0.0.0

      - name: Run Lighthouse audits
        run: npm run lighthouse
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword
          LIGHTHOUSE_BASE_URL: http://localhost:3000

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7
