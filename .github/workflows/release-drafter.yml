name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    # Only publish and bump version on push to main (not on PR events).
    # Merging a release PR must not publish another release, so skip the whole
    # job — before release-drafter publishes anything — when the pushed commit
    # is one. The full message is checked so this holds for squash merges
    # ("chore: release vX") and merge commits ("... from owner/chore/release-vX").
    if: >-
      github.event_name != 'push' ||
      !(contains(github.event.head_commit.message, 'chore: release v') ||
        contains(github.event.head_commit.message, 'chore/release-v'))
    permissions:
      contents: write
      pull-requests: write
      # Lets the bump step dispatch CI on the release branch
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: release
        with:
          # Publish immediately on merge to main; remain a draft on PR events
          publish: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The steps below only run on merge to main (push event)
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        if: github.event_name == 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Bump package.json and update CHANGELOG.md
        if: github.event_name == 'push'
        env:
          RESOLVED_VERSION: ${{ steps.release.outputs.resolved_version }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Every merge to main publishes a release, but package.json only moves
          # when a release PR merges. Add a CHANGELOG section for each release
          # since then (oldest first, so the newest ends up on top), so this PR
          # carries everything the release PRs it supersedes would have.
          CURRENT=$(node -p "require('./package.json').version")
          for V in $(gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName | ltrimstr("v")' | sort -V); do
            [ "$V" != "$CURRENT" ] || continue
            [ "$(printf '%s\n' "$CURRENT" "$V" | sort -V | tail -1)" = "$V" ] || continue
            [ "$V" != "$RESOLVED_VERSION" ] || continue
            RESOLVED_VERSION="$V" \
              RELEASE_BODY="$(gh release view "v$V" --json body --jq .body)" \
              RELEASE_DATE="$(gh release view "v$V" --json publishedAt --jq '.publishedAt[:10]')" \
              node scripts/update-changelog.mjs
          done
          # The release just published last, from the action's own output
          node scripts/update-changelog.mjs

          # Bump package.json without creating a git tag
          npm version "$RESOLVED_VERSION" --no-git-tag-version

          # Configure git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/release-v${RESOLVED_VERSION}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          # No [skip ci]: the merged bump must run publish.yml, which pushes the
          # new version's image tags. The job-level guard above stops the loop.
          git commit -m "chore: release v${RESOLVED_VERSION}"
          git push origin "$BRANCH"

          # Open a PR — branch protection prevents direct pushes to main
          PR_URL=$(gh pr create \
            --title "chore: release v${RESOLVED_VERSION}" \
            --body "Automated version bump and CHANGELOG update for v${RESOLVED_VERSION}, including any releases since the last merged release PR." \
            --base main \
            --head "$BRANCH" \
            --label "chore")

          # Older release PRs now conflict with this one on package.json and
          # CHANGELOG.md, and everything they carried is included here.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"chore/release-v\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r OLD; do
              gh pr close "$OLD" --delete-branch --comment "Superseded by $PR_URL"
            done

          # Events caused by GITHUB_TOKEN don't start workflows, so the PR gets no
          # pull_request CI run. workflow_dispatch is the exception, so the
          # release branch still gets a full CI run on its head commit.
          gh workflow run ci.yml --ref "$BRANCH"
