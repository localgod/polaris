name: Publish

on:
  push:
    branches:
      - main

# Never cancel a running publish: a cancelled release merge would leave its
# version tags to be pushed by a later merge, with newer code in the image.
# Ordinary merges share one group, so a newer one still replaces a waiting one
# and latest ends up on the newest commit. A release merge gets its own group,
# because GitHub keeps only one waiting run per group and a later merge would
# otherwise drop it before it starts.
concurrency:
  group: "publish-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'chore: release v') && format('-{0}', github.sha) || '' }}"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and push ${{ matrix.image }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: polaris
            target: runner
            cache: app
          - image: polaris-migrator
            target: migrator
            cache: migrator

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      # package.json only changes when a release PR merges, so every other merge
      # carries the previous release's version. Push the version tags only the
      # first time a version is seen, so an exact version tag is never
      # overwritten with later code; every merge still gets latest and sha-<sha>.
      - name: Choose image tags
        id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          TAGS="$IMAGE:latest"$'\n'"$IMAGE:sha-${GITHUB_SHA::7}"
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists — not moving version tags"
          else
            echo "New version $VERSION — pushing version tags"
            TAGS+=$'\n'"$IMAGE:$VERSION"$'\n'"$IMAGE:$MINOR"$'\n'"$IMAGE:$MAJOR"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  # The server and its deploys live in localgod/infra; tell it the new images are on Docker Hub.
  notify-infra:
    name: Trigger deploy in localgod/infra
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          gh api repos/localgod/infra/dispatches \
            -f event_type=polaris-published \
            -f "client_payload[sha]=${{ github.sha }}"
